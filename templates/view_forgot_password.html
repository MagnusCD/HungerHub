{% include "_top.html" %}

<main class="login">
    <div class="container">
        <div class="logo">HungerHub</div>
        <div class="signin_box">
            <h1 class="reset">Reset password</h1>
            <form id="frm_forgot_password">
                <label for="user_email">Email</label>
                <input type="email" name="user_email" mix-check="{{ x.REGEX_EMAIL }}">
                
                <button class="cta" mix-post="/forgot-password" mix-data="#frm_forgot_password">Send link</button>
            </form>
            
            <p><a href="{{url_for('view_login')}}">Back to login</a></p>
        </div>
    </div>
</main>

{% include "_bottom.html" %}
