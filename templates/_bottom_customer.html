<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Initialize the map before rendering items -->
<script>
    // Initialize the map
    var map = L.map('map').setView([55.6845, 12.564148], 12);  // Centered on Copenhagen

    // Add OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 20,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Make the map object globally accessible for use in app.js
    window.map = map;  // This ensures the map object is available in app.js
</script>

<!-- Load your app.js script before the script where you call render_items -->
<script src="{{ url_for('static', filename='app.js') }}"></script>

<!-- Now you can safely call the render_items function after the app.js script is loaded -->
<script>
    // Pass the restaurant data directly as a JavaScript object
    const restaurants = JSON.parse('{{ restaurants | tojson | safe }}');
    render_items(restaurants);  // Now you can safely pass the data as an object
</script>

<!-- Load any other scripts (e.g., mixhtml.js) -->
<script src="{{ url_for('static', filename='mixhtml.js') }}"></script>
</body>
</html>
